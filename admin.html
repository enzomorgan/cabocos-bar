<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Painel Administrativo - Cabocos Bar</title>
        <link rel="stylesheet" href="css/admin.css">
    </head>

    <body>
        <header class="admin-header">
            <div>
                <h1>Cabocos Bar</h1>
                <p>Painel Administrativo de Pedidos</p>
            </div>

            <a href="index.html" class="back-site-btn">
                Ver cardápio
            </a>
        </header>

        <main class="admin-container">
            <section class="summary">
                <div class="summary-card">
                    <span>Total de pedidos</span>
                    <strong id="totalOrders">0</strong>
                </div>

                <div class="summary-card">
                    <span>Pedidos novos</span>
                    <strong id="newOrders">0</strong>
                </div>

                <div class="summary-card">
                    <span>Total vendido</span>
                    <strong id="totalSold">R$ 0,00</strong>
                </div>
            </section>

            <section class="filters">
                <button type="button" onclick="filterStatus('TODOS')" class="active">
                    Todos
                </button>

                <button type="button" onclick="filterStatus('NOVO')">
                    Novos
                </button>

                <button type="button" onclick="filterStatus('PREPARO')">
                    Em preparo
                </button>

                <button type="button" onclick="filterStatus('ENTREGA')">
                    Saiu para entrega
                </button>

                <button type="button" onclick="filterStatus('FINALIZADO')">
                    Finalizados
                </button>

                <button type="button" onclick="filterStatus('CANCELADO')">
                    Cancelados
                </button>
            </section>

            <section class="orders-header">
                <h2>Pedidos recebidos</h2>
                <p id="ordersInfo">Carregando pedidos...</p>
            </section>

            <section id="orders" class="orders">
                <p class="empty-message">Carregando pedidos...</p>
            </section>
        </main>

        <script type="module" src="admin.js"></script>
    </body>
</html>
