
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cabocos Bar - Cardápio</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="header">
            <div>
                <h1>Cabocos Bar</h1>
                <p>Pizzaria & Pastelaria</p>
            </div>
            <button class="cart-btn" onclick="openCart()">
                🛒 Carrinho
                <span id="cartCount">0</span>
            </button>
        </header>
        <section class="hero">
            <h2>Cardápio Online</h2>
            <p>Escolha seus itens e envie pelo WhatsApp</p>
            <p class="promo-text">Quinta-feira: comprando uma pizza G, ganha 1 refrigerante de 1L: Guaraná ou Pepsi.</p>
        </section>
        <nav id="categories" class="categories"></nav>
        <main id="menu" class="menu"></main>
        <aside id="cartModal" class="cart-modal">
            <div class="cart-content">
                <button class="close" onclick="closeCart()">×</button>
                <h2>Seu pedido</h2>
                <div id="cartItems"></div>
                <div id="promoBox" class="promo-box hidden"></div>
                <h3>Total: R$
                    <span id="cartTotal">0,00</span>
                </h3>
                <form id="orderForm">
                    <input
                        type="text"
                        id="clientName"
                        placeholder="Seu nome"
                        required
                    >
                    <input
                        type="text"
                        id="clientAddress"
                        placeholder="Endereço para entrega"
                        required
                    >
                    <textarea id="clientObs" placeholder="Observações"></textarea>
                    <select id="paymentMethod" required>
                        <option value="">Forma de Pagamento</option>
                        <option value="Cartão">Cartão</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Pix">Pix</option>
                    </select>
                    <div id="pixBox" class="pix-box hidden">
                        <p>
                            <strong>Pagamento via Pix</strong>
                        </p>
                        <p>Envie o comprovante no WhatsApp após concluir o pedido.</p>
                        <input type="file" id="pixProof" accept="image/*,.pdf">
                    </div>
                    <button type="submit" class="send-btn">Enviar Pedido no WhatsApp</button>
                </form>
            </div>
        </aside>
        <aside id="pizzaModal" class="cart-modal">
            <div class="cart-content">
                <button class="close" onclick="closePizzaModal()">×</button>
                <h2>Montar pizza</h2>
                <div class="pizza-form">
                    <label>Tamanho</label>
                    <select id="pizzaSize"></select>
                    <label>Sabor 1</label>
                    <select id="pizzaFlavor1"></select>
                    <label>Sabor 2</label>
                    <select id="pizzaFlavor2">
                        <option value="">Sem segundo sabor</option>
                    </select>
                    <label>Borda</label>
                    <select id="pizzaEdge"></select>
                    <p id="pizzaPreview" class="pizza-preview"></p>
                    <button type="button" class="send-btn" onclick="confirmPizza()">
                        Adicionar ao carrinho
                    </button>
                </div>
            </div>
        </aside>
        <script src="script.js"></script>
    </body>
</html>
